<!DOCTYPE html>
<html lang="tr" class="v3">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e16">
  <meta name="description" content="Realm of AdAstra — sefer, silo, ordu, zindan ve pazar üzerine kurulu krallık yönetimi oyunu.">
  <title>Realm of AdAstra</title>
  <link rel="icon" type="image/jpeg" href="realm_of_astra_banner.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&family=Fredoka:wght@600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/battle-arena.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/v3/kabuk.css">
  <link rel="stylesheet" href="css/v3/ekran.css">
  <link rel="stylesheet" href="css/zindan.css">
</head>
<body>

  <!-- ============================================================
       0. CINEMATIC LOADING & ROYAL SCROLL SCREEN (REALM OF ASTRA)
       ============================================================ -->
  <div id="loading-screen" class="loading-screen-overlay royal-scroll-loading">
    <div class="royal-scroll-card">
      <div class="royal-scroll-banner-wrap">
        <img src="realm_of_astra_banner.jpg" alt="Realm of AdAstra Royal Charter" class="royal-scroll-banner-img" />
      </div>
      <div class="royal-scroll-content">
        <div class="royal-scroll-title">REALM OF ASTRA</div>
        <div id="loading-quote" class="loading-subtext">Kadim Krallık Fermanı Açılıyor, Kaynaklar Yükleniyor...</div>
        <div class="loading-bar-container">
          <div id="loading-bar-fill" class="loading-bar-fill"></div>
        </div>
        <div id="loading-percentage" class="royal-scroll-pct">%0</div>
      </div>
    </div>
  </div>
  <script src="/boot.js"></script>

  <!-- Kapı kuralı: bekleme sırasındaki / askıdaki hesaba durum şeridi (sunucu doldurur) -->
  <div id="gate-banner" class="gate-banner" hidden></div>

  <!-- ============================================================
       1. ZİNDAN EKRANI (içeriği js/ui/zindan/ekran.js doldurur; kasabadaki üst çubuk js/ui/v3/kabuk.js tarafından kurulur)
       ============================================================ -->
  <section id="zindan-ekrani" class="zd" hidden aria-label="Zindan"></section>

  <!-- ============================================================
       1.5 PHASER GAME CANVAS CONTAINER
       ============================================================ -->
  <!-- 3B vadi (three.js, js/vadi3d/vadi.js); zindan sırasında gizlenir -->
  <div id="vadi3d-container" class="phaser-game-container vadi3d-container"></div>
  <div id="phaser-game-container" class="phaser-game-container"></div>

  <!-- 🧭 Yeni oyuncu rehberi (görevler & ödüller) -->
  <section id="guide-widget" class="guide-widget" aria-label="Krallık rehberi" hidden></section>

  <!-- ============================================================
       1.8 ULTRA-CRISP HTML HOVER TOOLTIP (KRİSTAL NETLİĞİNDE BAŞLIK)
       ============================================================ -->
  <div id="realm-hover-tooltip" class="realm-tooltip hidden">
    <div id="realm-tooltip-title" class="realm-tooltip-title">KRALLIK MEYDANI</div>
    <div id="realm-tooltip-sub" class="realm-tooltip-sub">Tıkla ve İncele</div>
  </div>

  <!-- ============================================================
       4. SIMPLIFIED CLEAN RPG MODAL OVERLAY
       ============================================================ -->
  <div id="rpg-modal" class="rpg-modal-overlay">
    <div class="rpg-modal-window">
      <div class="rpg-modal-header">
        <div id="modal-title" class="rpg-modal-title">
          <span>🌲</span> <span>ZÜMRÜT ORMANI</span>
        </div>
        <button id="btn-close-modal" class="rpg-modal-close" title="Pencereyi Kapat ve Kasabaya Dön (ESC)">
          <span>🏡</span> <span class="modal-close-text">KASABAYA DÖN</span>
        </button>
      </div>
      <div id="modal-body" class="rpg-modal-body">
        <!-- Dinamik İçerik -->
      </div>
    </div>
  </div>

  <!-- ============================================================
       BATTLE ARENA OVERLAY (CANLI SAVAŞ ARENASI - ZİNDAN & KOLEZYUM)
       ============================================================ -->
  <div id="battle-arena-modal" class="battle-arena-modal-overlay">
    <div class="shell aa-arena" data-mode="dungeon" data-theme="dark">

      <!-- HUD -->
      <div class="hud">
        <div class="brand"><span class="star">★</span> AdAstra <span class="tagline" style="color:var(--ink-dim); font-family:var(--font-body); font-weight:500; font-size:.72rem;">Canlı Savaş</span></div>
        <div class="mode-badge-wrap" id="aa-modeBadgeWrap">
          <div class="mode-badge dungeon" id="aa-modeBadgeDungeon">🗡️ Zindan Savaşı</div>
          <div class="mode-badge colosseum" id="aa-modeBadgeColosseum" hidden>🏟️ Kolezyum Düellosu</div>
        </div>
        <div class="hud-spacer"></div>
        <div class="hud-stat"><div class="label">Tur</div><div class="value" id="aa-roundVal">0</div></div>
        <div class="hud-stat"><div class="label">Durum</div><div class="value" id="aa-stateVal" style="font-size:.82rem;">Hazır</div></div>
        <button class="aa-exit-btn" id="aa-closeBtn" style="background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#fca5a5; border-radius:6px; padding:6px 12px; font-weight:800; cursor:pointer; margin-left:12px; font-size:0.85rem;" title="Savaştan Çık / Kasabaya Dön">✕ Çık</button>
      </div>

      <!-- context -->
      <div class="context-strip">
        <div id="aa-contextText">Kat 3 · Seviye 9 — <strong>Kadim Taş Golyat</strong> (Ara Boss)</div>
        <div class="rank-pill" id="aa-rankPill">+%100 Ganimet</div>
      </div>

      <!-- battlefield -->
      <div class="stage-wrap">
        <div class="stage" id="aa-stage">
          <div class="torch l"></div><div class="torch r"></div>
          <div class="crowd"></div><div class="sand-line"></div>

          <div class="flank ally" id="aa-allyFlank"></div>
          <div class="vs-mark">VS</div>
          <div class="flank enemy" id="aa-enemyFlank"></div>

          <div class="fx-layer" id="aa-fxLayer"></div>
          <div class="phase-banner" id="aa-phaseBanner"><div class="txt" id="aa-phaseTxt"></div></div>
          <div class="result-banner" id="aa-resultBanner">
            <div class="title" id="aa-resultTitle"></div>
            <div class="sub" id="aa-resultSub"></div>
            <div class="loot" id="aa-resultLoot"></div>
            <div class="note" id="aa-resultNote"></div>
            <div class="actions" id="aa-resultActions"></div>
            <div style="display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap;">
              <button id="aa-resultBtn" class="ctrl-btn">↺ Tekrar İzle</button>
              <button id="aa-resultCloseBtn" class="ctrl-btn primary">✓ Tamam</button>
            </div>
          </div>
        </div>
      </div>

      <!-- initiative queue -->
      <div class="queue-bar">
        <div class="queue-label">Sıradakiler</div>
        <div class="queue-track" id="aa-queueTrack"></div>
      </div>

      <!-- log -->
      <div class="log-wrap" id="aa-logWrap"></div>

      <!-- controls -->
      <div class="controls">
        <button class="ctrl-btn primary" id="aa-playBtn">▶ Savaşı Başlat</button>
        <button class="ctrl-btn" id="aa-skipBtn" style="background:rgba(234,179,8,0.2); border-color:#eab308; color:#fde047;">⏭️ Anında Bitir</button>
        <button class="ctrl-btn" id="aa-resetBtn">↺ Sıfırla</button>
        <div class="speed-group">
          <button class="speed-btn active" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="2">2×</button>
          <button class="speed-btn" data-speed="0.5">0.5×</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scriptler -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
