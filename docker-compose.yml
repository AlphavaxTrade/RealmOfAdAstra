# Realm of Astra — tek komutla çalıştırma:  docker compose up -d --build
# Ayarlar server/.env dosyasından okunur (örnek: server/.env.example)
services:
  realm:
    build: .
    restart: unless-stopped
    ports:
      # Yalnız aynı makinedeki HTTPS katmanına (Caddy/Nginx) açık; dışarıdan doğrudan erişilemez.
      # (Böylece ziyaretçi adres bilgisini sahteleyip hız sınırlarını atlatamaz; TRUST_PROXY=1 ile birlikte kullan.)
      - "127.0.0.1:8080:8080"
    env_file:
      - server/.env
    environment:
      - DB_FILE=/data/realm.db        # kayıt dosyası kalıcı klasörde (yeniden kurulumda silinmez)
    volumes:
      - ./data:/data
