# Elle yayın (kurumsal A8): imajı sürüm etiketiyle GHCR'a koyar. Sunucuya OTOMATİK ALMA YOKTUR; imajı sunucuya alıp başlatmak
# docs/DEPLOY.md adımlarıyla insan kararıdır. Yalnız main dalından çalışır.
name: Yayin

on:
  workflow_dispatch:
    inputs:
      surum:
        description: 'Sürüm etiketi, ör. 2.0.0 ya da 2.0.0-rc.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  imaj:
    name: imaj-yayin
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SURUM: ${{ inputs.surum }}
    steps:
      - name: Sürüm biçimini doğrula
        run: |
          echo "$SURUM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$' || { echo "Geçersiz sürüm: biçim 1.2.3 ya da 1.2.3-rc.1"; exit 1; }
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: İmajı derle ve gönder
        # Gerçek ağ imajı (denetim H1): depo değişkenleri (Settings > Variables) REALM_GERCEK_AG=1, VITE_PAYMENTS_CONTRACT ve
        # VITE_TOKEN_ADDRESS verilirse adresler derlemeye sabitlenir; REALM_GERCEK_AG=1 iken adres eksikse derleme hata verir.
        # Hiçbiri tanımlı değilse imaj deneme (TEST_MODE) imajıdır; gizli bilgi değil, herkese açık adreslerdir.
        env:
          REALM_GERCEK_AG: ${{ vars.REALM_GERCEK_AG }}
          VITE_PAYMENTS_CONTRACT: ${{ vars.VITE_PAYMENTS_CONTRACT }}
          VITE_TOKEN_ADDRESS: ${{ vars.VITE_TOKEN_ADDRESS }}
        run: |
          DEPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg REALM_GERCEK_AG="${REALM_GERCEK_AG:-0}" \
            --build-arg VITE_PAYMENTS_CONTRACT="${VITE_PAYMENTS_CONTRACT:-}" \
            --build-arg VITE_TOKEN_ADDRESS="${VITE_TOKEN_ADDRESS:-}" \
            -t "$DEPO:$SURUM" -t "$DEPO:son" .
          docker push "$DEPO:$SURUM"
          docker push "$DEPO:son"
