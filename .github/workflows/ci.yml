name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Sözdizimi kontrolü
        run: for f in js/*.js js/*/*.js scripts/windows/*.cjs; do node --check "$f"; done
      - name: Testler
        run: npm test
      - name: Yayın paketi
        run: npm run build
