# Otomatik üretildi: node scripts/openapi-uret.mjs (elle düzenlemeyin; açıklamalar docs/openapi/aciklamalar.json içinde)
openapi: 3.1.0
info:
  title: Realm of AdAstra API
  version: 2.0.0-alpha.1
  description: "Oyun sunucusunun HTTP arayüzü. Hepsi JSON; hata gövdesi { error }. Oturum anahtarı giriş yanıtındaki token'dır (Authorization: Bearer …). Yönetici uçları ADMIN_TOKEN ister. Her yanıtta X-Request-Id başlığı vardır; 500 yanıtında aynı kimlik gövdede de döner (günlükte aranır). Bu dosya koddan üretilir: node scripts/openapi-uret.mjs"
servers:
  - url: /
    description: Aynı kaynak
tags:
  - name: Genel
  - name: Hesap
  - name: Oyun
  - name: Cüzdan ve Kasa
  - name: Kolezyum
  - name: İlan pazarı
  - name: Yönetim
  - name: Sayfalar
paths:
  /api/ready:
    get:
      tags:
        - Genel
      summary: "Hazır mı: veritabanı yanıt veriyor ve dünya zamanlayıcısı canlı"
      operationId: get_api_ready
      security: &a1 []
      responses:
        "200":
          description: "{ hazir, kontroller: { veritabani, zamanlayici }, zamanlayiciTur, zamanlayiciHata, zamanlayiciYasSn }. Hazır değilse 503 ve aynı gövde."
          content:
            application/json:
              schema:
                type: object
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
        "503":
          $ref: "#/components/responses/Hata503"
  /api/rates:
    get:
      tags:
        - Genel
      summary: Oyundaki ADA oranları (RealmRates sözleşmesinden; herkese açık)
      operationId: get_api_rates
      security: *a1
      responses:
        "200":
          description: Oran sözleşmesi kapalıysa 404.
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/Hata404"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/health:
    get:
      tags:
        - Genel
      summary: Süreç ayakta mı (canlılık)
      operationId: get_api_health
      security: *a1
      responses:
        "200":
          description: "{ ok, time, version, chain, payoutMode, testMode, payments }"
          content:
            application/json:
              schema:
                type: object
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/register:
    post:
      tags:
        - Hesap
      summary: Kayıt (e-posta + parola); doğrulama e-postası gider, oturum AÇILMAZ
      operationId: post_api_account_register
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                  description: En az güvenlik kuralları hesap modülünde
                promo:
                  type: string
                  description: İsteğe bağlı promo kodu; doğrulamadan sonra uygulanır
              required:
                - email
                - password
      responses:
        "200":
          description: "{ ok, sent, message, devLink }. E-posta kayıtlı olsun olmasın yanıt aynıdır (hesap varlığı sızdırılmaz). devLink yalnız deneme modunda dolu."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/login:
    post:
      tags:
        - Hesap
      summary: Giriş (e-posta ve parola)
      operationId: post_api_account_login
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: "{ token, playerId } ya da iki adımlı doğrulama açıksa { need2fa: true, ticket }. Yanlış bilgi 401 (zamanlama farkı yok)."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/login2fa:
    post:
      tags:
        - Hesap
      summary: İki adımlı doğrulama ile girişi tamamla
      operationId: post_api_account_login2fa
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket:
                  type: string
                code:
                  type: string
                  description: Uygulama kodu ya da yedek kod
              required:
                - ticket
                - code
      responses:
        "200":
          description: "{ token, playerId, backupLeft }"
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/verify:
    post:
      tags:
        - Hesap
      summary: E-posta doğrulama (e-postadaki bağlantı)
      operationId: post_api_account_verify
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        "200":
          description: "{ ok } ya da giriş de yapılabiliyorsa { ok, token, playerId }. Kapı kuralı: yer varsa vatandaş olur, yoksa bekleme sırasına girer."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/resend:
    post:
      tags:
        - Hesap
      summary: Doğrulama e-postasını yeniden gönder
      operationId: post_api_account_resend
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        "200":
          description: Hesap varlığını sızdırmayan sabit yanıt.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/2fa/setup:
    post:
      tags:
        - Hesap
      summary: İki adımlı doğrulama kurulumu başlat
      operationId: post_api_account_2fa_setup
      security: &a2
        - bearerAuth: []
      responses:
        "200":
          description: "{ ok, secret, uri, qr } (qr: SVG data URL)"
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/2fa/enable:
    post:
      tags:
        - Hesap
      summary: İki adımlı doğrulamayı aç (ilk kodu doğrula)
      operationId: post_api_account_2fa_enable
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
                - code
      responses:
        "200":
          description: "{ ok, backupCodes } — 10 yedek kod yalnız bu yanıtta bir kez gösterilir."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/2fa/disable:
    post:
      tags:
        - Hesap
      summary: İki adımlı doğrulamayı kapat
      operationId: post_api_account_2fa_disable
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
                - code
      responses:
        "200":
          description: "403 ve need2fa: kod gerekli/yanlış."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "403":
          $ref: "#/components/responses/Hata403"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/forgot:
    post:
      tags:
        - Hesap
      summary: Parola sıfırlama e-postası iste
      operationId: post_api_account_forgot
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        "200":
          description: Hesap varlığını sızdırmayan sabit yanıt.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/reset:
    post:
      tags:
        - Hesap
      summary: Yeni parola belirle (e-postadaki anahtarla)
      operationId: post_api_account_reset
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
                - token
                - password
      responses:
        "200":
          description: "{ ok, twoFactor }. Başarılı sıfırlama eski oturumları iptal eder."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/me:
    get:
      tags:
        - Hesap
      summary: Hesap özeti ve bağlı cüzdan durumu
      operationId: get_api_account_me
      security: *a2
      responses:
        "200":
          description: Hesap yoksa 404.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Hata401"
        "404":
          $ref: "#/components/responses/Hata404"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/wallet/nonce:
    post:
      tags:
        - Hesap
      summary: Cüzdana imzalatılacak mesajı al
      operationId: post_api_account_wallet_nonce
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: 0x… cüzdan adresi
              required:
                - address
      responses:
        "200":
          description: "{ message }"
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/wallet/link:
    post:
      tags:
        - Hesap
      summary: İmzayı gönder; e-posta onayı istenir
      operationId: post_api_account_wallet_link
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signature:
                  type: string
                code:
                  type: string
                  description: İki adımlı doğrulama açıksa gerekli
              required:
                - signature
      responses:
        "200":
          description: İmza geçerliyse onay e-postası gider.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "403":
          $ref: "#/components/responses/Hata403"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/wallet/confirm:
    post:
      tags:
        - Hesap
      summary: Cüzdan bağlamayı onayla (e-postadaki bağlantı)
      operationId: post_api_account_wallet_confirm
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        "200":
          description: "{ ok }"
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/wallet/cancel:
    post:
      tags:
        - Hesap
      summary: Bekleyen cüzdan değişikliğini iptal et
      operationId: post_api_account_wallet_cancel
      security: *a2
      responses:
        "200":
          description: "{ ok }"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/account/logout:
    post:
      tags:
        - Hesap
      summary: Bu cihazdan çıkış (oturum anahtarı silinir)
      operationId: post_api_account_logout
      security: *a2
      responses:
        "200":
          description: "{ ok }"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/state:
    get:
      tags:
        - Oyun
      summary: Oyuncu kaydı + dünya görüntüsü (zamanla ilerleyen işler sunucuda işlenir)
      operationId: get_api_state
      security: *a2
      responses:
        "200":
          description: "{ player, world, address, epochId, gate }"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/action:
    post:
      tags:
        - Oyun
      summary: Oyun işlemi (yalnız beyaz listedekiler; bkz. x-islemler)
      operationId: post_api_action
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: x-islemler anahtarlarından biri
                args:
                  type: array
                  description: İşlemin argüman türleri x-islemler[name].argumanlar'da
              required:
                - name
      responses:
        "200":
          description: "{ result, player, world, address, epochId, gate }. Reddedilen/geçersiz işlem 400; vatandaş olmayan hesap 403 (bekleme sırası)."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "403":
          $ref: "#/components/responses/Hata403"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/dev/vanilla-reset:
    post:
      tags:
        - Oyun
      summary: "YALNIZ deneme sunucusu: dünyayı ve kayıtları ilk güne döndür"
      operationId: post_api_dev_vanilla_reset
      security: *a2
      responses:
        "200":
          description: Gerçek sunucuda 404.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Hata401"
        "404":
          $ref: "#/components/responses/Hata404"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/promo/redeem:
    post:
      tags:
        - Oyun
      summary: Promo kodunu kullan
      operationId: post_api_promo_redeem
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
                - code
      responses:
        "200":
          description: "{ ok, message }"
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/wallet:
    get:
      tags:
        - Cüzdan ve Kasa
      summary: Yatırma adresi, çekim durumu, geçmiş
      operationId: get_api_wallet
      security: *a2
      responses:
        "200":
          description: "{ account, gameWallet, tokenAddress, deposits, withdraw }"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/withdraw:
    post:
      tags:
        - Cüzdan ve Kasa
      summary: Çekim talebi (serbest bakiyeden)
      operationId: post_api_withdraw
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                code:
                  type: string
                  description: İki adımlı doğrulama açıksa gerekli
              required:
                - amount
      responses:
        "200":
          description: "{ success, message, ... }. E-posta doğrulanmamış ya da cüzdan bağlı değilse success:false."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "403":
          $ref: "#/components/responses/Hata403"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/withdraw/cancel:
    post:
      tags:
        - Cüzdan ve Kasa
      summary: Bekleyen çekim talebini geri al
      operationId: post_api_withdraw_cancel
      security: *a2
      responses:
        "200":
          description: "{ success, message }"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/kasa:
    get:
      tags:
        - Cüzdan ve Kasa
      summary: Oyun Kasası durumu
      operationId: get_api_kasa
      security: *a2
      responses:
        "200":
          description: "Kasa kapalıysa { enabled: false }."
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/kasa/refresh:
    post:
      tags:
        - Cüzdan ve Kasa
      summary: Kasa zincir bakiyesini yenile
      operationId: post_api_kasa_refresh
      security: *a2
      responses:
        "200":
          description: Kasa durumu. Zincir okunamazsa 503.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
        "503":
          $ref: "#/components/responses/Hata503"
  /api/kasa/withdraw:
    post:
      tags:
        - Cüzdan ve Kasa
      summary: Kasa bakiyesini bağlı cüzdana çek
      operationId: post_api_kasa_withdraw
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asset:
                  type: string
                  description: ADA | AVAX (büyük harf)
                amount:
                  type: number
                code:
                  type: string
                  description: İki adımlı doğrulama açıksa gerekli
              required:
                - asset
                - amount
      responses:
        "200":
          description: "{ ok, ... }"
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "403":
          $ref: "#/components/responses/Hata403"
        "404":
          $ref: "#/components/responses/Hata404"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/kasa/test-deposit:
    post:
      tags:
        - Cüzdan ve Kasa
      summary: "YALNIZ deneme sunucusu: sahte Kasa yatırması"
      operationId: post_api_kasa_test_deposit
