          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "404":
          $ref: "#/components/responses/Hata404"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /api/admin/kapi/player:
    post:
      tags:
        - Yönetim
      summary: Bir hesabı elle içeri al / sıraya koy / askıya al
      operationId: post_api_admin_kapi_player
      security: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playerId:
                  type: string
                status:
                  type: string
              required:
                - playerId
                - status
      responses:
        "200":
          description: Güncel durum.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Hata400"
        "401":
          $ref: "#/components/responses/Hata401"
        "404":
          $ref: "#/components/responses/Hata404"
        "429":
          $ref: "#/components/responses/Hata429"
        "500":
          $ref: "#/components/responses/Hata500"
  /admin:
    get:
      tags:
        - Sayfalar
      summary: Yönetici paneli sayfası
      description: Sayfanın kendisi herkese açıktır; şifre sayfada sorulur ve yönetici uçları (/api/admin/*) şifresiz çalışmaz.
      operationId: get_admin
      security: []
      responses:
        "200":
          description: İçerik
          content:
            text/html:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/Hata429"
  /admin.js:
    get:
      tags:
        - Sayfalar
      summary: Yönetici paneli betiği
      description: Panel sayfasının betiği.
      operationId: get_admin_js
      security: []
      responses:
        "200":
          description: İçerik
          content:
            text/javascript:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/Hata429"
  /metrics:
    get:
      tags:
        - Genel
      summary: Prometheus ölçümleri (metin biçimi)
      description: "Yönetici şifresiyle ya da YALNIZ aynı makineden (vekil başlığı olmayan yerel istek). Önünde Caddy varsa dışarıdan gelen her istek şifre ister. Ölçü listesi: docs/kurumsal/GOZLEM.md"
      operationId: get_metrics
      security:
        - adminAuth: []
      responses:
        "200":
          description: İçerik
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Hata401"
        "429":
          $ref: "#/components/responses/Hata429"
  /{dosya}:
    get:
      tags:
        - Sayfalar
      summary: Oyunun derlenmiş dosyaları (dist/)
      description: "Hash'li dosyalar bir yıl önbelleklenir; sıkıştırılmış (br/gz) kopyalar istemci destekliyorsa sunulur. Bilinmeyen yol ana sayfaya düşmez: 404."
      operationId: get_dosya
      security: []
      parameters:
        - name: dosya
          in: path
          required: true
          description: Dosya yolu
          schema:
            type: string
      responses:
        "200":
          description: İçerik
          content:
            "*/*":
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Hata404"
        "429":
          $ref: "#/components/responses/Hata429"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Oyuncu oturum anahtarı (giriş yanıtındaki token; sunucuda yalnız özeti saklanır)
    adminAuth:
      type: http
      scheme: bearer
      description: ADMIN_TOKEN (en az 24 karakter). 10 yanlış deneme IP başına 10 dakika bekletir
  schemas:
    Hata:
      type: object
      properties:
        error:
          type: string
        istekKimligi:
          type: string
          description: Yalnız 500 yanıtında
      required:
        - error
  responses:
    Hata400:
      description: Geçersiz istek / kural reddi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata401:
      description: Giriş (oturum anahtarı) ya da yönetici yetkisi gerekli
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata403:
      description: İzin yok (iki adımlı doğrulama kodu, vatandaşlık vb.)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata404:
      description: Bulunamadı ya da bu sunucuda kapalı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata409:
      description: Çakışma (yeniden denenebilir)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata429:
      description: Çok hızlı istek; biraz yavaşla
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata500:
      description: Sunucu hatası (gövdede istekKimligi; günlükte aranır)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata503:
      description: Hazır değil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
x-argüman-tipleri:
  int: Tam sayı (mutlak değeri en çok 1e9)
  idx: Sıra numarası, 0-63
  qty: Pozitif sayı (en çok 1e12)
  bool: true ya da false
  str: En çok 64 karakterlik metin
  name: En çok 24 karakterlik ad
  slot: "Teçhizat yuvası: weapon, helmet, armor, legs, boots"
  node: Kaynak alanı / hammadde adı (js/config.js RESOURCE_KEYS)
  res: Hammadde adı ya da fragments, boxes, keys
  idxArr: 1-18 sıra numarasından oluşan dizi (her biri 0-63)
  slotRef: Teçhizat yuvası adı (krallık yuvası ya da askerin yuvası) ya da cephanelikteki eşyanın konumu (ref)
  ref: "Eşya konumu { source: armory|kingdom|soldier, slotKey, armoryIndex, soldierIndex, itemId } (eşyanın kendisi gönderilemez)"
  buff: Taverna güçlendirmesi adı (js/config.js TAVERN_BUFFS)
  tool: Alet adı (js/config.js TOOLS)
  scroll: "Parşömen: scroll_heal, scroll_stamina, scroll_teleport, scroll_repair"
  row: "Savaş sırası: front ya da back"
  wheelPay: "Çark ödeme türü: ada, ticket ya da bir hammadde"
  wheelMult: "Çark çarpanı: 1, 2 ya da 10 (yalnız ASTRA ile çevirmede; bedel ve ödeme aynı oranda artar)"
  quest: Rehber görevi kimliği
  section: Krallık Yolu bölüm kimliği (10 bölümden biri ya da final)
  gorulen: Krallık Yolu için "ekranı gördü" anahtarı (sabit liste)
  eser: "Genesis Yolu: koleksiyon eserinin kimliği (yalnız oyunun 18 eseri, ör. artifact_01)"
  fightOpts: "Seçenekler { payGateFee?: boolean }"
  konseyHedef: "Konsey hedefi: 'otorite' (Madencilik Otoritesi) ya da 'proje' (etkin Konsey projesi)"
  healOpts: "Seçenekler { kismi?: boolean }: şifalı ot tam iyileştirmeye yetmiyorsa eldeki otla kısmen iyileştir"
  amounts: "Hammadde miktarları { hammadde: miktar } (en çok 8 anahtar, 0..1e12)"
