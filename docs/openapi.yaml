              schema:
                type: string
        "404":
          $ref: "#/components/responses/Hata404"
        "429":
          $ref: "#/components/responses/Hata429"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Oyuncu oturum anahtarı (giriş yanıtındaki token; sunucuda yalnız özeti saklanır)
    adminAuth:
      type: http
      scheme: bearer
      description: ADMIN_TOKEN (en az 24 karakter). 10 yanlış deneme IP başına 10 dakika bekletir
  schemas:
    Hata:
      type: object
      properties:
        error:
          type: string
        istekKimligi:
          type: string
          description: Yalnız 500 yanıtında
      required:
        - error
  responses:
    Hata400:
      description: Geçersiz istek / kural reddi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata401:
      description: Giriş (oturum anahtarı) ya da yönetici yetkisi gerekli
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata403:
      description: İzin yok (iki adımlı doğrulama kodu, vatandaşlık vb.)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata404:
      description: Bulunamadı ya da bu sunucuda kapalı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata409:
      description: Çakışma (yeniden denenebilir)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata429:
      description: Çok hızlı istek; biraz yavaşla
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata500:
      description: Sunucu hatası (gövdede istekKimligi; günlükte aranır)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
    Hata503:
      description: Hazır değil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hata"
x-argüman-tipleri:
  int: Tam sayı (mutlak değeri en çok 1e9)
  idx: Sıra numarası, 0-63
  qty: Pozitif sayı (en çok 1e12)
  bool: true ya da false
  str: En çok 64 karakterlik metin
  name: En çok 24 karakterlik ad
  slot: "Teçhizat yuvası: weapon, helmet, armor, legs, boots"
